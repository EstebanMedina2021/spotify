spring:
  datasource:
    url: jdbc:h2:mem:playlist-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  sql:
    init:
      mode: never

  h2:
    console:
      enabled: false

  autoconfigure:
    exclude:
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.image.GoogleGenAiImageConnectionAutoConfiguration

app:
  jwt:
    secret: test-secret-key-must-be-at-least-thirty-two-characters-long-for-hs256
    expiration-minutes: 15
    issuer: playlist-api-test
  ai:
    provider: mock
    mock:
      scenario: OK
  cors:
    allowed-origin: http://localhost:4200
  spotify:
    client-id: test-client
    client-secret: test-secret
    base-url: https://api.spotify.com/v1
    accounts-url: https://accounts.spotify.com
  rate-limit:
    login-per-ip: 1000
    login-per-user: 1000
    lists: 1000
    recommendations: 1000
    spotify: 1000