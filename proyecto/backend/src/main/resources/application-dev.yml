spring:
  datasource:
    url: jdbc:h2:file:./data/playlist-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  sql:
    init:
      mode: always
      # Demo user (demo / Demo1234!). Dev only: the base config must never load it.
      data-locations: classpath:db/migration/V2__seed_dev.sql

app:
  ai:
    provider: ${AI_PROVIDER:mock}

logging:
  level:
    com.playlist: DEBUG