spring:
  ai:
    google:
      genai:
        api-key: ${GEMINI_AI_API_KEY:}
        chat:
          options:
            model: gemini-2.0-flash
            temperature: 0.7
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: llama3.2
          temperature: 0.7

  application:
    name: playlist-api

  datasource:
    url: jdbc:h2:file:./data/playlist;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V1__schema.sql
      data-locations: classpath:db/migration/V2__seed_dev.sql

  h2:
    console:
      enabled: false

  threads:
    virtual:
      enabled: true

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.apache.http: INFO
    reactor.netty: INFO
    root: INFO

resilience4j:
  timelimiter:
    instances:
      aiClient:
        timeout-duration: 5s
  circuitbreaker:
    instances:
      aiClient:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
    issuer: ${JWT_ISSUER:playlist-api}
  ai:
    provider: ${AI_PROVIDER:mock}
    timeout-seconds: 5
    mock:
      scenario: OK
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:4200}
  spotify:
    client-id: ${SPOTIFY_CLIENT_ID:}
    client-secret: ${SPOTIFY_CLIENT_SECRET:}
    base-url: https://api.spotify.com/v1
    accounts-url: https://accounts.spotify.com
  rate-limit:
    login-per-ip: 5
    login-per-user: 5
    lists: 60
    recommendations: 5
    spotify: 30