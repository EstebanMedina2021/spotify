spring:
  ai:
    retry:
      # No retries: default backoff (up to ~minutes) outlives the 5 s TimeLimiter and
      # keeps worker threads busy. Resilience is handled by the circuit breaker + fallback.
      max-attempts: 1
    model:
      # none (mock) | google-genai (AI_PROVIDER=gemini) | ollama (AI_PROVIDER=ollama)
      chat: ${SPRING_AI_MODEL_CHAT:none}
    google:
      genai:
        api-key: ${GEMINI_AI_API_KEY:}
        chat:
          options:
            # No default on purpose: Gemini model ids are retired regularly (gemini-2.0-flash was shut down
            # on 2026-06-01). Set GEMINI_AI_MODEL to a current id; startup fails if it is missing.
            model: ${GEMINI_AI_MODEL:}
            temperature: 0.7
            # Caps the cost of every call (03 5.5 / estandar 1.6)
            max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:512}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2}
          temperature: 0.7
          # Caps generation length (cost/latency); small local models can ramble
          num-predict: ${AI_MAX_OUTPUT_TOKENS:512}
          # Ollama constrains the output to valid JSON, which small models need to follow the schema
          format: json

  application:
    name: playlist-api

  datasource:
    url: jdbc:h2:file:./data/playlist;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V1__schema.sql

  h2:
    console:
      enabled: false

  threads:
    virtual:
      enabled: true

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.apache.http: INFO
    reactor.netty: INFO
    root: INFO

resilience4j:
  timelimiter:
    instances:
      aiClient:
        # same value as the HTTP clients' timeout (03 5.1: HTTP timeout <= limiter)
        timeout-duration: ${app.ai.timeout-seconds:5}s
  circuitbreaker:
    instances:
      aiClient:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
    issuer: ${JWT_ISSUER:playlist-api}
  ai:
    provider: ${AI_PROVIDER:mock}
    # HTTP read timeout and time limiter. 5 s suits hosted APIs; a small local model on CPU needs
    # far more (e.g. AI_TIMEOUT_SECONDS=90).
    timeout-seconds: ${AI_TIMEOUT_SECONDS:5}
    mock:
      scenario: OK
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:4200}
  spotify:
    client-id: ${SPOTIFY_CLIENT_ID:}
    client-secret: ${SPOTIFY_CLIENT_SECRET:}
    base-url: https://api.spotify.com/v1
    accounts-url: https://accounts.spotify.com
  rate-limit:
    login-per-ip: 5
    login-per-user: 5
    lists: 60
    recommendations: 5
    spotify: 30
    logout: 30
    me: 60